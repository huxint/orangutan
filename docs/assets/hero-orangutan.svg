<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Orangutan — 本地个人 AI Agent 与森林伙伴</title>
  <desc id="hero-desc">暖羊皮纸与陶土色调的 Orangutan 主题横幅：左侧是可爱的小红毛猩猩 Oran 端着嫩叶和热茶挥手，右侧展示 Orangutan 品牌标语、核心特性标签与信使小蓝雀 Pip。</desc>
  <defs>
    <style>
      .serif{font-family:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC",serif}
      .sans{font-family:"Noto Sans CJK SC","Sarasa UI SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-variant-ligatures:none}
      .ink{fill:#292118}
      .sub{fill:#5b4e3f}
      .muted{fill:#695a47}
      .accent{fill:#b24a1d}
      .pill-text{font-size:13px;font-weight:600;fill:#4d3f31}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;fill:#8f3e14}
      .float-slow{animation:floatY 4.2s ease-in-out infinite}
      .float-bird{animation:birdHover 3.4s ease-in-out infinite}
      .wave-arm{transform-box:fill-box;transform-origin:15% 80%;animation:wave 3.2s ease-in-out infinite}
      .tuft-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
      .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blinkAnim 5.2s infinite}
      .steam{animation:steamRise 3.6s ease-in-out infinite}
      .sparkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 3.8s ease-in-out infinite}
      @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes birdHover{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-4px,-7px) rotate(3deg)}}
      @keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-10deg)}55%{transform:rotate(5deg)}}
      @keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(6deg)}}
      @keyframes blinkAnim{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(0.1)}}
      @keyframes steamRise{0%{opacity:0.15;transform:translateY(4px)}50%{opacity:0.75;transform:translateY(-4px)}100%{opacity:0.15;transform:translateY(-10px)}}
      @keyframes twinkle{0%,100%{opacity:0.45;transform:scale(0.9)}50%{opacity:1;transform:scale(1.12)}}
      @media(prefers-reduced-motion:reduce){
        .float-slow,.float-bird,.wave-arm,.tuft-sway,.blink,.steam,.sparkle{animation:none}
      }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="55%" stop-color="#f6f2ea"/>
      <stop offset="100%" stop-color="#ede5d7"/>
    </linearGradient>
    <radialGradient id="oranGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d8c4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f2e3d7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f6f2ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#de7b49"/>
      <stop offset="55%" stop-color="#c65b2b"/>
      <stop offset="100%" stop-color="#a8441b"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdeee0"/>
      <stop offset="100%" stop-color="#f4d8be"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fa074"/>
      <stop offset="100%" stop-color="#3d6b4a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5d5bf"/>
      <stop offset="100%" stop-color="#d4bfa3"/>
    </linearGradient>
  </defs>

  <!-- Canvas & Warm Frame -->
  <rect width="1200" height="380" rx="26" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#dcd3c4" stroke-width="1.5"/>

  <!-- Subtle Botanical Corner Accents -->
  <g opacity="0.55">
    <path d="M-10 96 C26 70, 56 34, 70 -6 C42 26, 12 42, -12 52 Z" fill="#e6ede2"/>
    <path d="M18 118 C48 92, 82 68, 108 32 C74 52, 42 74, 18 118 Z" fill="#e6ede2"/>
    <path d="M1210 296 C1168 308, 1138 336, 1118 386 C1150 364, 1184 344, 1212 332 Z" fill="#e6ede2"/>
    <path d="M1196 254 C1158 272, 1126 300, 1102 336 C1136 312, 1170 290, 1196 254 Z" fill="#f0dfd1"/>
  </g>

  <!-- Soft Backdrop Halo Behind Oran -->
  <circle cx="205" cy="196" r="142" fill="url(#oranGlow)"/>
  <circle cx="205" cy="196" r="112" fill="none" stroke="#e4d4c2" stroke-width="1.5" stroke-dasharray="5 7"/>

  <!-- Warm Desk Ledge -->
  <rect x="74" y="294" width="268" height="18" rx="9" fill="url(#deskGrad)" stroke="#c2aa8b" stroke-width="1.5"/>
  <ellipse cx="206" cy="296" rx="92" ry="7" fill="#b49a7c" opacity="0.35"/>

  <!-- Little Stitched Notebook on Desk (Left) -->
  <g transform="translate(86, 268)">
    <rect x="0" y="6" width="48" height="22" rx="4" fill="#487654" stroke="#31523a" stroke-width="1.8"/>
    <rect x="4" y="2" width="44" height="20" rx="3" fill="#fbf8f2" stroke="#5b4e3f" stroke-width="1.6"/>
    <line x1="12" y1="8" x2="38" y2="8" stroke="#cbbba6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="32" y2="14" stroke="#cbbba6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M36 2 L36 13 L40 10 L44 13 L44 2 Z" fill="#b24a1d"/>
  </g>

  <!-- Cute Mascot: Oran the Little Orangutan -->
  <g transform="translate(115, 76)">
    <!-- Soft Fluffy Shoulders / Body -->
    <path d="M34 156 C22 164, 18 194, 24 218 L148 218 C154 194, 150 164, 138 156 C122 146, 50 146, 34 156 Z"
          fill="url(#furGrad)" stroke="#4c2c1d" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Cream Belly Patch -->
    <ellipse cx="86" cy="196" rx="37" ry="26" fill="#fbf3e8"/>

    <!-- Resting Left Paw on Desk -->
    <ellipse cx="44" cy="214" rx="16" ry="11" fill="#f4d8be" stroke="#4c2c1d" stroke-width="2.5"/>
    <path d="M38 214 L38 220 M45 215 L45 221" stroke="#4c2c1d" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cute Round Ears -->
    <circle cx="24" cy="96" r="17" fill="url(#furGrad)" stroke="#4c2c1d" stroke-width="2.8"/>
    <circle cx="25" cy="96" r="9" fill="#f4d8be"/>
    <circle cx="148" cy="96" r="17" fill="url(#furGrad)" stroke="#4c2c1d" stroke-width="2.8"/>
    <circle cx="147" cy="96" r="9" fill="#f4d8be"/>

    <!-- Shaggy Fluffy Head Silhouette -->
    <path d="M86 24
             C122 24, 149 48, 152 84
             C156 102, 150 124, 138 140
             C124 156, 106 162, 86 162
             C66 162, 48 156, 34 140
             C22 124, 16 102, 20 84
             C23 48, 50 24, 86 24 Z"
          fill="url(#furGrad)" stroke="#4c2c1d" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Waving Right Arm Holding Sprout Leaf (Clearly Visible Beside Head) -->
    <g class="wave-arm">
      <path d="M138 168 C164 162, 184 140, 184 118 C184 108, 170 107, 165 117 C159 130, 149 144, 132 152"
            fill="url(#furGrad)" stroke="#4c2c1d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="176" cy="112" r="12.5" fill="#f4d8be" stroke="#4c2c1d" stroke-width="2.5"/>
      <!-- Little Sprout Leaf -->
      <path d="M179 102 C182 84, 195 74, 208 73 C205 88, 194 99, 179 102 Z"
            fill="url(#leafGrad)" stroke="#2e5238" stroke-width="2" stroke-linejoin="round"/>
      <path d="M179 102 C188 92, 195 85, 201 79" fill="none" stroke="#dce8da" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M177 102 C173 91, 164 86, 156 88 C160 97, 168 102, 177 102 Z"
            fill="#85b088" stroke="#2e5238" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Cheek Fur Tufts -->
    <path d="M21 102 L14 110 L23 114" fill="#c65b2b" stroke="#4c2c1d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M151 102 L158 110 L149 114" fill="#c65b2b" stroke="#4c2c1d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Signature Curly Top Tuft -->
    <g class="tuft-sway">
      <path d="M82 26 C78 8, 96 2, 102 14 C106 22, 95 26, 90 25"
            fill="#de7b49" stroke="#4c2c1d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M74 28 C66 15, 76 10, 82 20"
            fill="#de7b49" stroke="#4c2c1d" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Warm Cream Heart-Shaped Face Mask -->
    <path d="M86 58
             C98 52, 124 56, 130 78
             C136 98, 134 122, 120 138
             C110 148, 98 152, 86 152
             C74 152, 62 148, 52 138
             C38 122, 36 98, 42 78
             C48 56, 74 52, 86 58 Z"
          fill="url(#faceGrad)"/>

    <!-- Cute Round Spectacles (Subtle Scholarly Vibe) -->
    <circle cx="64" cy="96" r="17" fill="none" stroke="#8a5a3c" stroke-width="2.2" opacity="0.82"/>
    <circle cx="108" cy="96" r="17" fill="none" stroke="#8a5a3c" stroke-width="2.2" opacity="0.82"/>
    <path d="M81 96 Q86 93 91 96" fill="none" stroke="#8a5a3c" stroke-width="2.2" stroke-linecap="round" opacity="0.82"/>

    <!-- Big Glossy Blinking Eyes -->
    <g class="blink">
      <circle cx="64" cy="96" r="9.5" fill="#292118"/>
      <circle cx="67.5" cy="92.5" r="3.4" fill="#ffffff"/>
      <circle cx="60.5" cy="99.5" r="1.6" fill="#ffffff" opacity="0.85"/>

      <circle cx="108" cy="96" r="9.5" fill="#292118"/>
      <circle cx="111.5" cy="92.5" r="3.4" fill="#ffffff"/>
      <circle cx="104.5" cy="99.5" r="1.6" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Soft Eyebrows -->
    <path d="M55 76 Q64 72 72 75" fill="none" stroke="#7d3b1d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M100 75 Q108 72 117 76" fill="none" stroke="#7d3b1d" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="47" cy="112" rx="9" ry="5.5" fill="#eb8c72" opacity="0.52"/>
    <ellipse cx="125" cy="112" rx="9" ry="5.5" fill="#eb8c72" opacity="0.52"/>

    <!-- Tiny Button Nose & Warm Smile -->
    <ellipse cx="86" cy="109" rx="5" ry="3.2" fill="#8b4d32"/>
    <path d="M77 120 Q86 129 95 120" fill="none" stroke="#4c2c1d" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Steaming Ceramic Teacup on Desk (Right of Oran) -->
  <g transform="translate(274, 260)">
    <path class="steam" d="M12 -2 C9 -8, 15 -12, 12 -18" fill="none" stroke="#b9ae9c" stroke-width="2" stroke-linecap="round"/>
    <path class="steam" d="M21 0 C18 -6, 24 -10, 21 -16" fill="none" stroke="#b9ae9c" stroke-width="1.8" stroke-linecap="round" style="animation-delay:0.8s"/>
    <path d="M31 11 C39 11, 39 23, 31 23" fill="none" stroke="#5b4e3f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M4 6 L31 6 L29 27 C28.5 31, 25 34, 17.5 34 C10 34, 6.5 31, 6 27 Z"
          fill="#fbf8f2" stroke="#5b4e3f" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="17.5" cy="20" r="3.2" fill="#b24a1d" opacity="0.8"/>
  </g>

  <!-- Warm Sparkles around Oran -->
  <g fill="#d98a4e">
    <path class="sparkle" d="M90 112 L93 120 L101 123 L93 126 L90 134 L87 126 L79 123 L87 120 Z"/>
    <path class="sparkle" d="M312 126 L314 132 L320 134 L314 136 L312 142 L310 136 L304 134 L310 132 Z" style="animation-delay:1.1s"/>
    <circle cx="114" cy="176" r="3" fill="#6fa074" opacity="0.7"/>
  </g>

  <!-- Right Column: Editorial Brand Identity & Positioning -->
  <g transform="translate(384, 58)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="248" height="30" rx="15" fill="#f2e3d7" stroke="#ddbca6" stroke-width="1.2"/>
    <circle cx="17" cy="15" r="4.5" fill="#b24a1d"/>
    <text x="30" y="19.5" class="sans eyebrow">C++26 · PERSONAL AGENT</text>

    <!-- Brand Wordmark: Orangutan. -->
    <text x="0" y="102" class="serif ink" font-size="68" font-weight="700" letter-spacing="-1.5">Orangutan<tspan class="accent">.</tspan></text>

    <!-- Tagline -->
    <text x="2" y="148" class="sans ink" font-size="22" font-weight="700">运行在自己机器上的个人 AI Agent 运行时与森林伙伴</text>
    <text x="2" y="180" class="sans sub" font-size="15.5">把模型循环、显式权限、长期记忆、多渠道接入与动态小队装进一套可验证的 C++26 架构。</text>

    <!-- Three Feature Pills -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="206" height="40" rx="12" fill="#fbf8f2" stroke="#dcd3c4" stroke-width="1.3"/>
      <circle cx="20" cy="20" r="5" fill="#b24a1d"/>
      <text x="34" y="25" class="sans pill-text">显式边界 · 安全可控</text>

      <rect x="220" y="0" width="214" height="40" rx="12" fill="#fbf8f2" stroke="#dcd3c4" stroke-width="1.3"/>
      <circle cx="240" cy="20" r="5" fill="#3d6b4a"/>
      <text x="254" y="25" class="sans pill-text">持久会话 · 长期记忆</text>

      <rect x="448" y="0" width="214" height="40" rx="12" fill="#fbf8f2" stroke="#dcd3c4" stroke-width="1.3"/>
      <circle cx="468" cy="20" r="5" fill="#476b83"/>
      <text x="482" y="25" class="sans pill-text">多端接入 · 动态小队</text>
    </g>
  </g>

  <!-- Floating Mini Companion: Pip the Messenger Songbird (Top Right) -->
  <g class="float-bird" transform="translate(1018, 62)">
    <!-- Soft flight trail behind tail -->
    <path d="M98 32 Q118 22 138 30" fill="none" stroke="#c8b9a4" stroke-width="1.8" stroke-dasharray="4 5" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M74 36 L94 26 L90 42 Z" fill="#3d8499" stroke="#2c444d" stroke-width="2" stroke-linejoin="round"/>
    <!-- Plump Body -->
    <ellipse cx="48" cy="38" rx="30" ry="23" fill="#5aa1b5" stroke="#2c444d" stroke-width="2.4"/>
    <!-- Warm Apricot Belly -->
    <path d="M24 44 C30 58, 58 60, 68 48 C58 44, 38 42, 24 44 Z" fill="#f2a673"/>
    <!-- Tiny Raised Wing -->
    <path d="M44 30 C52 14, 72 16, 70 30 C64 36, 50 38, 44 30 Z" fill="#3d8499" stroke="#2c444d" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Eye & Rosy Cheek -->
    <circle cx="33" cy="31" r="4.2" fill="#292118"/>
    <circle cx="34.4" cy="29.6" r="1.4" fill="#ffffff"/>
    <ellipse cx="38" cy="39" rx="4.5" ry="2.8" fill="#eb8c72" opacity="0.55"/>
    <!-- Beak Holding Mini Envelope -->
    <polygon points="18,34 8,38 19,42" fill="#e5a349" stroke="#2c444d" stroke-width="1.8" stroke-linejoin="round"/>
    <g transform="translate(-14, 37) rotate(-8)">
      <rect x="0" y="0" width="24" height="16" rx="2.5" fill="#fbf8f2" stroke="#5b4e3f" stroke-width="1.6"/>
      <polyline points="1,2 12,10 23,2" fill="none" stroke="#5b4e3f" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="12" cy="9.5" r="2.3" fill="#b24a1d"/>
    </g>
  </g>
</svg>
